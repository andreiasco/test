<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetare parolă</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Georgia, "Times New Roman", serif;
            background: #f4efe8;
            color: #2d2430;
        }

        body {
            align-items: center;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: #fffdf9;
            border: 1px solid #dfd3c8;
            border-radius: 8px;
            box-shadow: 0 18px 45px rgba(56, 37, 27, .12);
            max-width: 430px;
            padding: 32px;
            width: 100%;
        }

        h1 {
            margin: 0 0 10px;
        }

        p {
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: 700;
            margin: 18px 0 7px;
        }

        input {
            border: 1px solid #bcaea2;
            border-radius: 4px;
            box-sizing: border-box;
            font: inherit;
            padding: 12px;
            width: 100%;
        }

        button {
            background: #7b2450;
            border: 0;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            margin-top: 24px;
            padding: 12px 18px;
            width: 100%;
        }

        button:disabled {
            cursor: wait;
            opacity: .65;
        }

        .mesaj {
            min-height: 24px;
        }

        .ascuns {
            display: none;
        }

        .eroare {
            color: #b3261e;
        }

        .succes {
            color: #26753c;
        }

        a {
            color: #7b2450;
        }
    </style>
</head>

<body>
    <main>
        <h1>Resetează parola</h1>
        <p id="descriere">Introdu o parolă nouă pentru contul tău.</p>

        <form id="resetPasswordForm" novalidate>
            <label for="newPassword">Parolă nouă</label>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required
                placeholder="12 caractere, literă mare, literă mică, cifră">

            <label for="confirmPassword">Confirmă parola</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>

            <button id="resetPasswordButton" type="submit">Salvează parola</button>
        </form>

        <p id="resetPasswordMessage" class="mesaj" aria-live="polite"></p>
        <p><a href="index.html">Înapoi la pagina principală</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/core/config.js"></script>
    <script src="js/site/reset-password.js"></script>
</body>

</html>
